# Shared defaults for trusted Codex sessions in this repository.
# Explicit session or CLI selections take precedence.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
