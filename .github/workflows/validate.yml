name: Validate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [full, affected], default: full}
      base_ref: {description: Required for affected mode, type: string}
permissions: {contents: read}
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-key
      MODEL_RUNTIME: fake
      IMAGE_PROVIDER_MODE: fake
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select affected validation
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ inputs.base_ref }}
          CI_MODE: ${{ inputs.mode || 'full' }}
        run: node scripts/ci/validate.mjs select
      - name: Test selection
        if: steps.scope.outputs.selector == 'true'
        run: node --test scripts/ci/selection.test.mjs
      - name: Workflow syntax
        if: steps.scope.outputs.workflow == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Shell syntax and lint
        if: steps.scope.outputs.shell == 'true'
        run: |
          set -euo pipefail
          bash -n scripts/deploy/vps-deployment.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 --severity=warning scripts/deploy/vps-deployment.sh tests/shell/vps-host.test.sh tests/shell/vps-deployment-script.test.sh tests/shell/vps-backup-helper.test.sh tests/shell/vps-systemd-resume.test.sh
      - uses: hashicorp/setup-terraform@v3
        if: steps.scope.outputs.terraform == 'true' || steps.scope.outputs.bootstrap == 'true'
        with: {terraform_version: 1.11.4}
      - name: Terraform format
        if: steps.scope.outputs.terraform == 'true' || steps.scope.outputs.bootstrap == 'true'
        env:
          ROOT: ${{ steps.scope.outputs.terraform }}
          BOOTSTRAP: ${{ steps.scope.outputs.bootstrap }}
        run: |
          set -euo pipefail
          if [[ "$ROOT" == true ]]; then terraform -chdir=infra/terraform fmt -check; fi
          if [[ "$BOOTSTRAP" == true ]]; then terraform -chdir=infra/terraform/bootstrap fmt -check; fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.node == 'true'
        with: {node-version: 24.21.0, cache: npm}
      - if: steps.scope.outputs.node == 'true'
        run: npm ci
      - if: steps.scope.outputs.static == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.static == 'true'
        run: npm run lint
      - name: Pure contracts
        if: steps.scope.outputs.node == 'true'
        run: node scripts/ci/validate.mjs contracts
      - if: steps.scope.outputs.agent == 'true'
        run: npm run test:agent
      - name: Selected tests
        if: steps.scope.outputs.node == 'true'
        run: node scripts/ci/validate.mjs tests
      - name: Deployment shell tests
        if: steps.scope.outputs.shell == 'true'
        run: |
          set -euo pipefail
          bash tests/shell/vps-deployment-script.test.sh
          bash tests/shell/vps-host.test.sh
      - name: Terraform validation and tests
        if: steps.scope.outputs.terraform == 'true' || steps.scope.outputs.bootstrap == 'true'
        env:
          ROOT: ${{ steps.scope.outputs.terraform }}
          BOOTSTRAP: ${{ steps.scope.outputs.bootstrap }}
        run: |
          set -euo pipefail
          for target in terraform terraform/bootstrap; do
            if [[ "$target" == terraform && "$ROOT" != true ]] || [[ "$target" == terraform/bootstrap && "$BOOTSTRAP" != true ]]; then continue; fi
            workspace=$(mktemp -d)
            cp -a "infra/$target/." "$workspace/"
            terraform -chdir="$workspace" init -backend=false -lockfile=readonly
            terraform -chdir="$workspace" validate
            terraform -chdir="$workspace" test
          done
      - name: Publish validation summary
        if: always()
        env:
          CI_OUTCOME: ${{ job.status }}
        run: node scripts/ci/validate.mjs summary
