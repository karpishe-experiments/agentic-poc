name: AWS infrastructure operation
on:
  workflow_call:
    inputs:
      stack: { type: string, required: true }
      apply: { type: boolean, required: true }
      lock_held: { type: boolean, required: false, default: false }
permissions: { contents: read, id-token: write }
jobs:
  terraform:
    environment: ${{ inputs.stack == 'master' && '_shared' || format('_{0}', inputs.stack) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.11.4 }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ inputs.apply && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}", aws-region: eu-west-1 }
      - run: cp infra/config/deployment.env.example infra/config/deployment.env
      - name: Fill configuration
        run: |
          sed -i "s/AWS_ACCOUNT_ID=.*/AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}/;s/STATE_BUCKET=.*/STATE_BUCKET=${{ vars.STATE_BUCKET }}/;s/OPERATIONS_BUCKET=.*/OPERATIONS_BUCKET=${{ vars.OPERATIONS_BUCKET }}/" infra/config/deployment.env
      - name: Plan
        env: { STACK: "${{ inputs.stack == 'master' && 'shared' || inputs.stack }}" }
        run: |
          scripts/deploy/deploy.sh plan "$STACK"
          sha256sum .deploy/plans/"$STACK".tfplan infra/terraform/"${{ inputs.stack == 'master' && 'shared' || 'environment' }}"/.terraform.lock.hcl infra/config/configured.json > .deploy/plans/"$STACK".manifest.sha256
      - uses: actions/upload-artifact@v4
        with: { name: "terraform-${{ inputs.stack }}-${{ github.sha }}", path: .deploy/plans/*.tfplan* }
      - name: Apply exact plan
        if: inputs.apply
        env: { STACK: "${{ inputs.stack == 'master' && 'shared' || inputs.stack }}", OPERATION: terraform-apply, LOCK_HELD: "${{ inputs.lock_held || inputs.stack != 'master' }}" }
        run: scripts/deploy/deploy.sh apply "$STACK"
