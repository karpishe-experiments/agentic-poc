name: Dify staging tool key
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: kids-booklet-vps-operation, cancel-in-progress: false}
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify master-owned staging request
        run: test "$GITHUB_REF_NAME" = master
      - uses: ./.github/actions/vps-access
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      - name: Stage and rotate the protected key
        id: rotation
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DIFY_TOOL_KEY: ${{ secrets.DIFY_TOOL_KEY }}
        run: |
          set -euo pipefail
          bash scripts/deploy/vps-deployment.sh --action rotate-dify-tool-key --environment staging --vps-host "$VPS_HOST" --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --config infra/config/vps.json --apply 2>&1 | tee "$RUNNER_TEMP/dify-tool-key-output.txt"
      - name: Publish rotation summary
        if: always()
        env:
          OUTCOME: ${{ steps.rotation.outcome }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            printf '## Dify staging tool-key rotation\n\n'
            printf '| Environment | Request ID | Outcome |\n'
            printf '| --- | --- | --- |\n'
            printf '| `staging` | `%s` | **%s** |\n\n' "$REQUEST_ID" "$OUTCOME"
            if [[ -s "$RUNNER_TEMP/dify-tool-key-output.txt" ]]; then
              printf '```text\n'
              grep -E "^(exists|verified|created|updated|failed|error|result): " "$RUNNER_TEMP/dify-tool-key-output.txt" || true
              printf '```\n'
            else
              printf 'No sanitized rotation result was produced. Inspect the failed step logs.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
