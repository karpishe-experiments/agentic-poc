name: Infrastructure
on:
  push: { branches: [master], paths: ['infra/**', 'deploy/**', 'scripts/deploy/vps-deployment.sh', '.github/workflows/infrastructure.yml'] }
  workflow_dispatch: { inputs: { apply: { type: boolean, default: false } } }
permissions: { contents: read }
defaults: {run: {shell: bash}}
concurrency: { group: kids-booklet-vps-operation, cancel-in-progress: false }
jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify infrastructure branch
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          STAGING_HOSTNAME: ${{ vars.STAGING_HOSTNAME }}
          PROD_HOSTNAME: ${{ vars.PROD_HOSTNAME }}
          DEPLOY_HOSTNAME: ${{ vars.DEPLOY_HOSTNAME }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_TERRAFORM_ACCESS_KEY_ID: ${{ secrets.R2_TERRAFORM_ACCESS_KEY_ID }}
          R2_TERRAFORM_SECRET_ACCESS_KEY: ${{ secrets.R2_TERRAFORM_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = master
          for name in VPS_HOST DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_HOST_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID STAGING_HOSTNAME PROD_HOSTNAME DEPLOY_HOSTNAME R2_STATE_BUCKET R2_ENDPOINT R2_TERRAFORM_ACCESS_KEY_ID R2_TERRAFORM_SECRET_ACCESS_KEY; do
            [[ -n "${!name}" ]] || { printf 'Missing required configuration: %s\n' "$name" >&2; exit 1; }
          done
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.11.4, terraform_wrapper: false}
      - uses: ./.github/actions/vps-access
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          host-key: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      - name: Plan or apply infrastructure
        id: infrastructure
        run: |
          set -euo pipefail
          bash scripts/deploy/vps-deployment.sh --action infrastructure --vps-host "$TARGET_HOST" --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ${{ (github.event_name == 'push' || inputs.apply) && '--apply' || '' }} 2>&1 | tee "$RUNNER_TEMP/infrastructure-output.txt"
        env:
          TARGET_HOST: ${{ vars.VPS_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_staging_hostname: ${{ vars.STAGING_HOSTNAME }}
          TF_VAR_prod_hostname: ${{ vars.PROD_HOSTNAME }}
          TF_VAR_deploy_hostname: ${{ vars.DEPLOY_HOSTNAME }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TERRAFORM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TERRAFORM_SECRET_ACCESS_KEY }}
      - name: Publish infrastructure summary
        if: always()
        env:
          MODE: ${{ (github.event_name == 'push' || inputs.apply) && 'apply' || 'preview' }}
          OUTCOME: ${{ job.status }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            printf "## Infrastructure result\n\n"
            printf "| Mode | Commit | Request ID | Outcome |\n"
            printf "| --- | --- | --- | --- |\n"
            printf "| \`%s\` | \`%s\` | \`%s\` | **%s** |\n\n" "$MODE" "$GITHUB_SHA" "$REQUEST_ID" "$OUTCOME"
            if [[ -s "$RUNNER_TEMP/infrastructure-output.txt" ]]; then
              printf "\`\`\`text\n"
              grep -E "^(exists|would create|would update|created|updated|verified|failed|error|result): " "$RUNNER_TEMP/infrastructure-output.txt" || true
              printf "\`\`\`\n"
              if [[ "$OUTCOME" == failure ]] && grep -Fxq 'updated: infrastructure lock acquired' "$RUNNER_TEMP/infrastructure-output.txt"; then
                printf "\nThe VPS retained infrastructure journal \`%s\`. Confirm this run has stopped, inspect \`--action status\`, and release only this request with the runbook's \`infra-unlock\` procedure before retrying.\n" "$REQUEST_ID"
              fi
            else
              printf "No sanitized infrastructure result was produced. Inspect the failed step logs.\n"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
