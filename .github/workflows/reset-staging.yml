name: Reset staging
on:
  workflow_dispatch:
    inputs:
      confirmation: {description: Type kids_booklet, required: true}
permissions: {contents: read}
concurrency: {group: kids-booklet-vps-operation, cancel-in-progress: false}
jobs:
  reset:
    uses: ./.github/workflows/vps-operation.yml
    with: {environment: staging, action: reset-staging, confirmation: '${{ inputs.confirmation }}'}
    secrets: inherit
