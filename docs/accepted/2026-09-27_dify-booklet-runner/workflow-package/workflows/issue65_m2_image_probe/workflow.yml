      zIndex: 0
    - data:
        code: "import json\nimport re\nfrom urllib.parse import urlencode\n\ndef main(authorization_body,\
          \ status_code, run_id, operation_id, workflow_run_id, parent_workflow_run_id,\
          \ booklet_origin):\n    if status_code != 200:\n        raise ValueError('Booklet\
          \ authorization failed')\n    data = json.loads(authorization_body).get('data',\
          \ {})\n    if data.get('started') is not True:\n        reason = data.get('reason')\n\
          \        if not isinstance(reason, str) or not reason:\n            raise\
          \ ValueError('Booklet did not provide an authorization reason')\n      \
          \  return {'fixture_url': '', 'upload_url': '', 'input_fingerprint': '',\
          \ 'authorization_reason': reason}\n    fingerprint = data.get('inputFingerprint')\n\
          \    context = data.get('context')\n    if data.get('role') != 'image' or\
          \ data.get('mode') != 'simulated' or not isinstance(fingerprint, str) or\
          \ not re.fullmatch(r'[0-9a-f]{64}', fingerprint) or not isinstance(context,\
          \ dict) or context.get('role') != 'image' or context.get('mode') != 'simulated'\
          \ or context.get('inputFingerprint') != fingerprint or not isinstance(context.get('imageRequest'),\
          \ dict):\n        raise ValueError('Booklet image authorization is inconsistent')\n\
          \    request = context['imageRequest']\n    if not isinstance(request.get('prompt'),\
          \ str) or not request['prompt'] or not isinstance(request.get('sourceVersionIds'),\
          \ list):\n        raise ValueError('Booklet image request is incomplete')\n\
          \    query = urlencode({'runId': run_id, 'operationId': operation_id, 'workflowRunId':\
          \ workflow_run_id, 'parentWorkflowRunId': parent_workflow_run_id or '',\
          \ 'inputFingerprint': fingerprint})\n    base = booklet_origin.rstrip('/')\
          \ + '/api/experiments/booklet-tools/'\n    return {'fixture_url': base +\
          \ 'image-fixture?' + query, 'upload_url': base + 'image?' + query, 'input_fingerprint':\
          \ fingerprint, 'authorization_reason': ''}\n"
        code_language: python3
        outputs:
