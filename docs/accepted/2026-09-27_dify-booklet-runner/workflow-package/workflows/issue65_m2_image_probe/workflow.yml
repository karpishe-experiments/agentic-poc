          \ ValueError('Booklet authorization transport failed')\n    data = json.loads(authorization_body).get('data')\n\
          \    if not isinstance(data, dict):\n        raise ValueError('Booklet authorization\
          \ envelope is missing')\n    result = {'authorized': '', 'authorization_reason':\
          \ '', 'request_json': '', 'input_fingerprint': ''}\n    if data.get('started')\
          \ is not True:\n        reason = data.get('reason')\n        if data.get('started')\
          \ is not False or not isinstance(reason, str) or not reason or len(reason)\
          \ > 1024:\n            raise ValueError('Booklet authorization denial is\
          \ invalid')\n        result['authorization_reason'] = reason\n        return\
          \ result\n    if data.get('mode') != 'real' or data.get('role') != 'image'\
          \ or data.get('taskId') not in ('J08', 'J09', 'J10', 'J13'):\n        raise\
          \ ValueError('Booklet image role differs')\n    fingerprint = data.get('inputFingerprint')\n\
          \    if not isinstance(fingerprint, str) or not re.fullmatch('[0-9a-f]{64}',\
          \ fingerprint):\n        raise ValueError('Booklet image fingerprint is\
          \ missing')\n    request = data.get('requestJson')\n    if not isinstance(request,\
          \ str) or not request or len(request.encode('utf-8')) > 131072 or '\\x00'\
          \ in request:\n        raise ValueError('Booklet image request is missing')\n\
          \    payload = json.loads(request)\n    canonical = lambda value: json.dumps(value,\
          \ sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)\n\
          \    if request != canonical(payload) or payload.get('schemaVersion') !=\
          \ 'booklet_real_image_request_v1' or not isinstance(payload.get('requestDigest'),\
          \ str):\n        raise ValueError('Booklet image request differs')\n   \
          \ digest = payload['requestDigest']\n    body = {key: value for key, value\
          \ in payload.items() if key != 'requestDigest'}\n    if not re.fullmatch('[0-9a-f]{64}',\
          \ digest) or hashlib.sha256(canonical(body).encode()).hexdigest() != digest\
          \ or type(payload.get('deadlineAtMs')) is not int or payload['deadlineAtMs']\
          \ <= time.time() * 1000:\n        raise ValueError('Booklet image digest\
          \ or deadline differs')\n    result.update(authorized='yes', request_json=request,\
          \ input_fingerprint=fingerprint)\n    return result\n"
