    - data:
        code: "import json\nimport re\n\ndef main(body, status_code, run_id, operation_id,\
          \ workflow_run_id, parent_workflow_run_id, input_fingerprint):\n    data\
          \ = json.loads(body).get('data', {})\n    asset_id = data.get('assetId')\n\
          \    digest = data.get('sha256')\n    if status_code != 200 or data.get('state')\
          \ != 'succeeded' or asset_id != operation_id or not isinstance(digest, str)\
          \ or not re.fullmatch(r'[0-9a-f]{64}', digest):\n        raise ValueError('Booklet\
          \ did not confirm saved image completion')\n    result = {'runId': run_id,\
          \ 'operationId': operation_id, 'workflowRunId': workflow_run_id, 'parentWorkflowRunId':\
          \ parent_workflow_run_id or None, 'inputFingerprint': input_fingerprint,\
          \ 'assetId': asset_id, 'sha256': digest}\n    return {'image_result': json.dumps(result)}\n"
        code_language: python3
