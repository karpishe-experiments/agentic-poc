          "y": 0
        type: custom
      - data:
          code: |
            import json
            from uuid import UUID

            def main(run_id, operation_id, workflow_run_id, parent_workflow_run_id, mode):
                if mode != 'real':
                    raise ValueError('This branch supports Real only')
                for value in (run_id, operation_id, workflow_run_id):
                    UUID(value)
                if parent_workflow_run_id:
                    UUID(parent_workflow_run_id)
                return {'identity_json': json.dumps({'runId': run_id, 'operationId': operation_id, 'workflowRunId': workflow_run_id, 'parentWorkflowRunId': parent_workflow_run_id or None})}
          code_language: python3
          outputs:
            identity_json:
              children: null
              type: string
          retry_config:
