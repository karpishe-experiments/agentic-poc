    - data:
        code: "\"\"\"Self-contained Dify Code node fixture for simulated J01-J10 proposals.\n\
          \nPinned Ali J03-J10 source: 631f547ec3f7ce375f740dd6f2b1b9aaebbde940.\n\
          Fixed-case simulation retains narrative dependencies and complete content.\n\
          Booklet owns durable IDs and acceptance; preference deviations remain warnings.\n\
          \"\"\"\n\nimport hashlib\nimport json\nimport re\nfrom uuid import UUID\n\
          \n\nCASES = {\n    \"playful_kid\": {\n        \"brief\": \"A young inventor\
          \ and tiny robot rescue a runaway kite; playful and reassuring; readers\
          \ 6–8; three single-scene story pages plus cover, two recurring characters,\
          \ one location.\",\n        \"title\": \"The Kite Rescue\", \"age\": \"\
          6-8\", \"premise\": \"A young inventor and a tiny robot rescue a runaway\
          \ kite in their neighborhood park.\",\n        \"theme\": \"Helping together\
          \ makes a hard problem smaller.\", \"promise\": \"A playful rescue ends\
          \ with everyone safe and proud.\", \"tone\": \"Playful and reassuring\"\
          ,\n        \"scope\": \"Three single-scene story pages plus a cover, with\
          \ two recurring characters and one park location.\",\n        \"characters\"\
          : [(\"Young inventor\", \"Invents a safe way to reach the kite\", \"Friend\
          \ and maker of the tiny robot\"), (\"Tiny robot\", \"Spots the kite and\
          \ helps test the plan\", \"Trusted companion of the inventor\")],\n    \
          \    \"locations\": [(\"Neighborhood park\", \"The kite escapes and is recovered\
          \ here\")],\n        \"arc\": [\"The inventor and robot fly a kite in the\
          \ park.\", \"A gust carries the kite into a tree.\", \"Their first reach\
          \ falls short, so they assemble a gentle retrieval tool.\", \"The inventor\
          \ listens to the robot's safer route around the tree.\", \"They recover\
          \ the kite and fly it together again.\"],\n        \"prose\": [\n      \
          \      \"The young inventor lifted a bright kite into the park breeze. The\
          \ tiny robot rolled beside them, chirping as the kite climbed. For a while,\
          \ they watched it dance above the grass together.\",\n            \"A sudden\
          \ gust tugged the string from the inventor's hand. The kite caught high\
          \ in a tree, beyond either friend's reach. The robot spotted it first and\
          \ gave a worried beep.\",\n            \"The inventor tried a long stick,\
          \ but its tip fell short. They stopped before shaking the branch and made\
          \ a soft hook from the safe things in their bag. Even that tool could not\
          \ reach from where they stood.\",\n            \"The robot rolled around\
          \ the trunk and found a clear path to a lower branch. The inventor listened,\
          \ moved with the robot, and lifted the hook gently. Together they eased\
          \ the kite free without hurting the tree.\",\n            \"Back on the\
          \ grass, the inventor checked the kite and smiled at the robot. They held\
          \ the string together as the breeze lifted it again. The rescue had worked\
          \ because each friend noticed something the other had missed.\",\n     \
          \   ],\n    },\n    \"enthusiast_parent\": {\n        \"brief\": \"A child\
          \ and grandparent turn a rainy afternoon into an indoor adventure; warm;\
          \ readers 3–5; five story pages plus cover, two recurring characters, one\
          \ location, including one simple two-panel page.\",\n        \"title\":\
          \ \"The Rainy Room Adventure\", \"age\": \"3-5\", \"premise\": \"A child\
          \ and grandparent turn a rainy afternoon into an indoor adventure.\",\n\
          \        \"theme\": \"Imagination and companionship brighten a quiet day.\"\
          , \"promise\": \"A warm adventure ends in comfort and shared delight.\"\
          , \"tone\": \"Warm and gentle\",\n        \"scope\": \"Five story pages\
          \ plus a cover, with two recurring characters, one home location, and one\
          \ simple two-panel page.\",\n        \"characters\": [(\"Child\", \"Chooses\
          \ the adventure's destination\", \"Grandchild of the grandparent\"), (\"\
          Grandparent\", \"Helps build and explore a pretend world\", \"Grandparent\
          \ of the child\")],\n        \"locations\": [(\"Family living room\", \"\
          A safe room becomes the imagined adventure setting\")],\n        \"arc\"\
          : [\"Rain keeps the child and grandparent inside.\", \"The child imagines\
          \ the sofa as a boat.\", \"They build a blanket sail and encounter a pretend\
          \ storm.\", \"The child suggests steering toward a pillow island.\", \"\
          They arrive, share a snack, and listen to the rain together.\"],\n     \
          \   \"prose\": [\n            \"Rain tapped the living room window all afternoon.\
          \ The child looked at the gray sky, and the grandparent settled beside them.\
          \ They decided that staying inside could be the start of an adventure.\"\
          ,\n            \"The child pointed to the sofa and imagined a boat. The\
          \ grandparent stepped aboard the rug beside it, and together they named\
          \ their quiet room a wide sea. The child became the captain.\",\n      \
          \      \"They draped a blanket over the sofa to make a sail. When the rain\
          \ grew louder, they pretended a storm had found their boat. The sail slipped,\
          \ so they held it steady and waited together.\",\n            \"The child\
          \ saw a pile of pillows across the room and called it an island. The grandparent\
          \ followed the captain's plan as they steered their pretend boat toward\
          \ it. Soon the blanket sail rested safely beside the pillows.\",\n     \
          \       \"On their pillow island, the child and grandparent shared a snack.\
          \ The rain was still falling, but it sounded gentle now. They sat close,\
          \ pleased with the world they had made together.\",\n        ],\n    },\n\
          \    \"professional_creator\": {\n        \"brief\": \"Two friends repair\
          \ a community observatory after a disagreement; precise emotional arc; readers\
          \ 9–12; eight story pages plus cover, two recurring characters, two locations,\
          \ at least two multi-panel pages.\",\n        \"title\": \"The Observatory\
          \ Lantern\", \"age\": \"9-12\", \"premise\": \"Two friends repair a community\
          \ observatory after a disagreement.\",\n        \"theme\": \"Trust grows\
          \ when friends listen and share responsibility.\", \"promise\": \"An honest\
          \ repair restores both the observatory and the friendship.\", \"tone\":\
          \ \"Reflective and hopeful\",\n        \"scope\": \"Eight story pages plus\
          \ a cover, with two recurring characters, two locations, and at least two\
          \ multi-panel pages.\",\n        \"characters\": [(\"First friend\", \"\
          Finds the damaged observatory lantern\", \"Friend and project partner of\
          \ the second friend\"), (\"Second friend\", \"Diagnoses the lantern and\
          \ proposes a repair\", \"Friend and project partner of the first friend\"\
          )],\n        \"locations\": [(\"Community observatory\", \"The damaged lantern\
          \ must be repaired before viewing night\"), (\"Workshop\", \"The friends\
          \ test a replacement part and talk through their disagreement\")],\n   \
          \     \"arc\": [\"The friends prepare the observatory for viewing night.\"\
          , \"A disagreement distracts them and the lantern stops working.\", \"Separate\
          \ repair attempts fail, and the opening time approaches.\", \"They acknowledge\
          \ each other's ideas and combine their plans.\", \"The lantern works; they\
          \ welcome neighbors and watch the stars together.\"],\n        \"prose\"\
          : [\n            \"The two friends opened the community observatory before\
          \ viewing night. One checked the lantern while the other arranged the tools\
          \ they would need. They had built this evening together, and both wanted\
          \ their neighbors to feel welcome.\",\n            \"When the lantern failed,\
          \ each friend thought they knew the cause. Their disagreement grew sharper\
          \ as the room darkened. They turned away from each other, and the observatory\
          \ remained unready.\",\n            \"Each friend tried a separate repair,\
          \ but neither attempt restored the light. The opening hour drew closer.\
          \ Looking at their unfinished work, they began to understand that the fault\
          \ needed both of their ideas.\",\n            \"At the workshop, one friend\
          \ explained the damaged part while the other described a safer connection.\
          \ They apologized for talking past each other and tested a replacement together.\
          \ The lantern glowed steadily in their hands.\",\n            \"They carried\
          \ the repaired lantern back to the observatory. As neighbors arrived, the\
          \ friends welcomed them side by side under the new light. Above them, the\
          \ first stars appeared, and their shared work felt stronger than either\
          \ plan alone.\",\n        ],\n    },\n}\n\nTASKS = (\"J01\", \"J02\", \"\
          J03\", \"J04\", \"J05\", \"J06\", \"J07\", \"J08\")\nPREFIX = \"Approved\
          \ concept constraint: \"\n\n\ndef current_version(artifact):\n    if not\
          \ artifact:\n        return None\n    return next((item for item in artifact.get(\"\
          versions\", []) if item[\"id\"] == artifact.get(\"currentVersionId\")),\
          \ None)\n\n\ndef add_notes(existing, additions):\n    return existing +\
          \ [item for item in additions if item not in existing]\n\n\ndef source(context,\
          \ task):\n    row = next((item for item in context.get(\"approvedSources\"\
          , []) if item[\"taskId\"] == task), None)\n    if not row:\n        raise\
          \ ValueError(f'{context[\"taskId\"]} requires approved {task}.')\n    return\
          \ row[\"content\"]\n\n\ndef proposal(task, content):\n    return {\"kind\"\
          : \"proposal\", \"payload\": {\"taskId\": task, \"content\": content}}\n\
          \n\ndef text(value, limit=16000):\n    return isinstance(value, str) and\
          \ 0 < len(value) <= limit and bool(value.strip())\n\n\ndef uuid(value):\n\
          \    return isinstance(value, str) and bool(re.fullmatch(r\"(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)\"\
          , value))\n\n\ndef assembled_style(content):\n    \"\"\"Mirror the assembled\
          \ shape needed by tester eligibility, not stored approval.\"\"\"\n\n   \
          \ def texts(value):\n        return isinstance(value, list) and len(value)\
          \ <= 100 and all(text(item) for item in value)\n\n    def hash64(value):\n\
          \        return isinstance(value, str) and bool(re.fullmatch(r\"[0-9a-f]{64}\"\
          , value))\n\n    if not isinstance(content, dict) or content.get(\"schemaVersion\"\
          ) != \"2\" or not text(content.get(\"title\"), 1000):\n        return False\n\
          \    if not all(text(content.get(key)) for key in (\"typographyDirection\"\
          , \"speechAndThoughtBubbleDirection\", \"stylePromptModule\")) or not hash64(content.get(\"\
          stylePromptModuleHash\")):\n        return False\n    definition = content.get(\"\
          styleDefinition\")\n    if not isinstance(definition, dict) or not all(text(definition.get(key))\
          \ for key in (\"mediumAndLineWork\", \"shapeLanguageAndProportions\", \"\
          colourAndContrast\", \"textureAndRendering\", \"lightingAndAtmosphere\"\
          , \"emotionalTone\", \"accessibilityAndReadability\")):\n        return\
          \ False\n    if not texts(content.get(\"exclusions\")) or not texts(content.get(\"\
          approvalQuestions\")) or not uuid(content.get(\"draftStyleVersionId\")):\n\
          \        return False\n    samples = content.get(\"samples\")\n    if not\
          \ isinstance(samples, list) or len(samples) != 2 or any(not isinstance(item,\
          \ dict) for item in samples) or {item.get(\"sampleKey\") for item in samples}\
          \ != {\"sample_1\", \"sample_2\"}:\n        return False\n    for sample\
          \ in samples:\n        build = sample.get(\"build\")\n        if not text(sample.get(\"\
          purpose\")) or not isinstance(build, dict) or not text(build.get(\"prompt\"\
          )) or not hash64(build.get(\"stylePromptModuleHash\")) or not all(uuid(build.get(key))\
          \ for key in (\"operationId\", \"assetId\")):\n            return False\n\
          \        sources = build.get(\"sourceVersionIds\")\n        if not isinstance(sources,\
          \ list) or not 1 <= len(sources) <= 10 or not all(uuid(item) for item in\
          \ sources) or len(set(sources)) != len(sources):\n            return False\n\
          \    return True\n\n\ndef style_fixture(context, previous, revision):\n\
          \    concept, outline, manuscript, characters, locations = [source(context,\
          \ task) for task in (\"J01\", \"J02\", \"J05\", \"J06\", \"J07\")]\n   \
          \ for task in (\"J01\", \"J02\", \"J05\", \"J06\", \"J07\"):\n        UUID(next(item[\"\
          id\"] for item in context[\"approvedSources\"] if item[\"taskId\"] == task))\n\
          \    persona = context[\"persona\"]\n    if concept[\"sourceInput\"] !=\
          \ context[\"brief\"] or len(outline[\"characters\"]) != 2 or len(characters[\"\
          characters\"]) != 2 or len(outline[\"locations\"]) != (2 if persona == \"\
          professional_creator\" else 1) or len(locations[\"locations\"]) != (2 if\
          \ persona == \"professional_creator\" else 1):\n        raise ValueError(\"\
          Reference sources do not match fixed case\")\n    current = previous[\"\
          content\"] if previous and (context.get(\"currentTarget\") or {}).get(\"\
          state\") != \"needs_review\" else None\n    plans = current.get(\"samplePlan\"\
          ) if current else None\n    if current and assembled_style(current):\n \
          \       plans = [{\"sampleKey\": item[\"sampleKey\"], \"purpose\": item[\"\
          purpose\"]} for item in current[\"samples\"]]\n    direction = \"Playful\
          \ clear shapes and lively but reassuring movement for developing readers.\"\
          \ if persona == \"playful_kid\" else \"Warm rounded shapes, gentle contrast,\
          \ and calm readable detail for early readers.\" if persona == \"enthusiast_parent\"\
          \ else \"Precise environmental detail and restrained light shifts that follow\
          \ the older readers' emotional arc.\"\n    module = current[\"stylePromptModule\"\
