app:
  name: issue65_probe_concept_20261003
  description: Deterministic modular invocation probe; no creative or provider execution.
  mode: workflow
  icon: C
  icon_type: emoji
  icon_background: '#E8F4FF'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: start
      type: custom
      position: {x: 0, y: 0}
      data:
        title: Input
        type: start
        variables:
        - {label: marker, variable: marker, type: text-input, required: true, default: '', options: []}
    - id: concept
      type: custom
      position: {x: 300, y: 0}
      data:
        title: Simulated Concept specialist
        type: code
        code_language: python3
        code: |
          def main(marker):
              return {"result": marker + "|changed|concept"}
        variables:
        - {variable: marker, value_selector: [start, marker]}
        outputs: {result: {type: string, children: null}}
    - id: finish
      type: custom
      position: {x: 600, y: 0}
      data:
        title: Result
        type: end
        outputs:
        - {variable: result, value_type: string, value_selector: [concept, result]}
    edges:
    - {id: start-concept, source: start, sourceHandle: source, target: concept, targetHandle: target, type: custom, data: {sourceType: start, targetType: code}}
    - {id: concept-finish, source: concept, sourceHandle: source, target: finish, targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
    viewport: {x: 0, y: 0, zoom: 0.8}
