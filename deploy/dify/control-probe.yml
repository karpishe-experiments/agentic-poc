app:
  description: Model-free issue-69 configuration and recovery probe.
  icon: "🔎"
  icon_background: '#E8F4FF'
  icon_type: emoji
  mode: workflow
  name: issue69_control_probe
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {enabled: false}
    opening_statement: ''
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
    - {id: start-echo, source: start, sourceHandle: source, target: echo, targetHandle: target, type: custom, data: {sourceType: start, targetType: code}}
    - {id: echo-finish, source: echo, sourceHandle: source, target: finish, targetHandle: target, type: custom, data: {sourceType: code, targetType: end}}
    nodes:
    - id: start
      type: custom
      position: {x: 80, y: 280}
      positionAbsolute: {x: 80, y: 280}
      data:
        title: Probe input
        type: start
        variables:
        - {label: marker, variable: marker, type: text-input, required: true, default: '', options: []}
    - id: echo
      type: custom
      position: {x: 380, y: 280}
      positionAbsolute: {x: 380, y: 280}
      data:
        title: Echo marker
        type: code
        code_language: python3
        code: |
          def main(marker):
              return {"result": marker}
        variables:
        - {variable: marker, value_selector: [start, marker]}
        outputs:
          result: {type: string, children: null}
    - id: finish
      type: custom
      position: {x: 680, y: 280}
      positionAbsolute: {x: 680, y: 280}
      data:
        title: Probe result
        type: end
        outputs:
        - {variable: result, value_type: string, value_selector: [echo, result]}
    viewport: {x: 0, y: 0, zoom: 0.8}
