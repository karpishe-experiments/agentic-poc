services:
  app:
    environment:
      DEPLOYMENT_ENV: _staging
      APP_HOSTNAME: ${APP_HOSTNAME:?APP_HOSTNAME is required}
      MONGODB_DATABASE: kids_booklet
      ASSETS_BUCKET: ${ASSETS_BUCKET:?ASSETS_BUCKET is required}
      DIAGNOSTICS_BUCKET: ${DIAGNOSTICS_BUCKET:?DIAGNOSTICS_BUCKET is required}
      RECOVERY_BUCKET: ${RECOVERY_BUCKET:?RECOVERY_BUCKET is required}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:?OBJECT_STORE_ENDPOINT is required}
      DIFY_EXPERIMENT_MODE: real
      DIFY_IMAGE_ENABLED: "true"
